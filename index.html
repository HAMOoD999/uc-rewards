<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UC Rewards</title>
<style>body{margin:0;background:#0b1119;color:#fff;font-family:Arial;padding:14px}.wrap{max-width:650px;margin:auto}.card{background:#151e29;border:1px solid #2d3949;border-radius:16px;padding:15px;margin-bottom:12px}input,button{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border-radius:10px}input{background:#0d141d;color:#fff;border:1px solid #3c4a5c}button{border:0;background:#e3a72c;font-weight:bold}.task{border:1px solid #374456;border-radius:12px;padding:12px;margin:8px 0}.balance{font-size:34px;font-weight:800}.muted{color:#aab4c2;font-size:13px}</style>
<div class="wrap"><div class="card"><h1>🎮 UC Rewards</h1><p class="muted">نظام مكافآت محفوظ على الخادم.</p><input id="name" placeholder="اسم المستخدم"><button onclick="login()">دخول / إنشاء حساب</button></div>
<div class="card"><div class="muted">رصيد النقاط</div><div class="balance" id="balance">0</div></div>
<div class="card"><h2>المهام</h2><div id="tasks"></div></div><div class="card"><h2>🎁 الاستبدال</h2><p>10,000 نقطة = طلب مكافأة.</p><button onclick="redeem()">طلب الاستبدال</button></div>
<div class="card"><h2>📜 السجل</h2><div id="history" class="muted"></div></div><p id="msg" class="muted"></p>
<p class="muted">هذه النسخة لا تتصل بخوادم PUBG ولا تعدّل UC الحقيقي. صرف المكافآت يحتاج قناة رسمية/مزودًا معتمدًا.</p></div>
<script>let uid=localStorage.getItem("uc_user")||"";async function api(p,o={}){o.headers=Object.assign({"Content-Type":"application/json","x-user-id":uid},o.headers||{});let r=await fetch(p,o),d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}function setB(n){balance.textContent=Number(n).toLocaleString("ar")}function msg(t){document.getElementById("msg").textContent=t}
async function login(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({username:name.value})});uid=d.userId;localStorage.setItem("uc_user",uid);setB(d.balance);msg("تم الدخول");load()}catch(e){msg(e.message)}}
async function load(){if(!uid)return;try{let m=await api("/api/me");setB(m.balance);let t=await api("/api/tasks");tasks.innerHTML=t.map(x=>`<div class="task"><b>${x.name}</b><br><span class="muted">+${x.points} نقطة</span><button onclick="complete('${x.id}')">إكمال المهمة</button></div>`).join("");let h=await api("/api/history");history.innerHTML=h.length?h.map(x=>`• ${x.reason}: ${x.amount>0?"+":""}${x.amount}<br>`).join(""):"لا يوجد سجل"}catch(e){msg(e.message)}}
async function complete(id){try{let d=await api("/api/complete-task",{method:"POST",body:JSON.stringify({taskId:id})});setB(d.balance);msg("تمت إضافة "+d.added+" نقطة من السيرفر");load()}catch(e){msg(e.message)}}
async function redeem(){try{let d=await api("/api/redeem",{method:"POST"});setB(d.balance);msg("تم إنشاء طلب: "+d.requestId)}catch(e){msg(e.message)}}load();</script></html>
