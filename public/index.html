<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UC Rewards</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f4f6f8;color:#111}
.wrap{max-width:520px;margin:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
h1,h2{margin-top:0}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;font-size:16px}
input{border:1px solid #ccc}button{border:0;background:#111;color:#fff;font-weight:700}
.balance{font-size:38px;font-weight:800;text-align:center;padding:12px}
.task{border:1px solid #eee;border-radius:12px;padding:12px;margin:10px 0}
.muted{color:#666;font-size:14px}
#msg{min-height:24px}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>🎮 UC Rewards</h1>
<p class="muted">نظام مكافآت محفوظ على الخادم.</p>
<input id="usernameInput" placeholder="اسم المستخدم">
<button id="loginBtn" type="button">دخول / إنشاء حساب</button>
</div>

<div class="card">
<div class="muted">الحساب</div>
<div id="account" class="muted">غير مسجل</div>
</div>

<div class="card">
<div class="muted">رصيد النقاط</div>
<div class="balance" id="balance">0</div>
</div>

<div class="card">
<h2>المهام</h2>
<div id="tasks" class="muted">سجّل الدخول لعرض المهام.</div>
</div>

<div class="card">
<h2>🎁 الاستبدال</h2>
<p>10,000 نقطة = طلب مكافأة.</p>
<button id="redeemBtn" type="button">طلب الاستبدال</button>
</div>

<div class="card">
<h2>📜 السجل</h2>
<div id="history" class="muted">لا يوجد سجل.</div>
</div>

<p id="msg" class="muted"></p>
<p class="muted">هذه النسخة لا تتصل بخوادم PUBG ولا تعدّل UC الحقيقي.</p>

</div>

<script>
let uid=localStorage.getItem("uc_user")||"";

const nameEl=document.getElementById("usernameInput");
const loginEl=document.getElementById("loginBtn");
const accountEl=document.getElementById("account");
const balanceEl=document.getElementById("balance");
const tasksEl=document.getElementById("tasks");
const historyEl=document.getElementById("history");
const msgEl=document.getElementById("msg");
const redeemEl=document.getElementById("redeemBtn");

function setBalance(n){
 balanceEl.textContent=Number(n||0).toLocaleString("ar");
}

function msg(t){
 msgEl.textContent=t||"";
}

async function api(path,options={}){
 const headers=Object.assign(
  {"Content-Type":"application/json","x-user-id":uid},
  options.headers||{}
 );
 const r=await fetch(path,Object.assign({},options,{headers}));
 const text=await r.text();
 let d;
 try{d=JSON.parse(text)}
 catch(e){throw new Error("الخادم لم يُرجع استجابة صحيحة")}
 if(!r.ok)throw new Error(d.error||"حدث خطأ");
 return d;
}

async function login(){
 const username=nameEl.value.trim();

 if(!username){
  msg("اكتب اسم المستخدم أولاً");
  return;
 }

 loginEl.disabled=true;
 msg("جاري إنشاء الحساب...");

 try{
  const d=await api("/api/register",{
   method:"POST",
   body:JSON.stringify({username})
  });

  uid=d.userId;
  localStorage.setItem("uc_user",uid);

  accountEl.textContent=d.username||username;
  setBalance(d.balance);
  msg("تم الدخول بنجاح ✅");

  await load();

 }catch(e){
  msg(e.message);
 }finally{
  loginEl.disabled=false;
 }
}

async function load(){
 if(!uid)return;

 try{
  const me=await api("/api/me");

  accountEl.textContent=me.username||"الحساب";
  setBalance(me.balance);

  const t=await api("/api/tasks");

  if(!t.length){
   tasksEl.textContent="لا توجد مهام حالياً";
  }else{
   tasksEl.innerHTML=t.map(x=>
    '<div class="task"><b>'+x.name+'</b><br>'+
    '<span class="muted">+'+Number(x.points).toLocaleString("ar")+
    ' نقطة</span><button type="button" onclick="completeTask(\''+
    x.id+'\')">إكمال المهمة</button></div>'
   ).join("");
  }

  const h=await api("/api/history");

  historyEl.innerHTML=h.length
   ?h.map(x=>"• "+x.reason+": "+(x.amount>0?"+":"")+x.amount).join("<br>")
   :"لا يوجد سجل";

 }catch(e){
  msg(e.message);
 }
}

async function completeTask(id){
 try{
  const d=await api("/api/complete-task",{
   method:"POST",
   body:JSON.stringify({taskId:id})
  });

  setBalance(d.balance);
  msg("تمت إضافة "+d.added+" نقطة ✅");
  await load();

 }catch(e){
  msg(e.message);
 }
}

async function redeem(){
 if(!uid){
  msg("سجّل الدخول أولاً");
  return;
 }

 try{
  const d=await api("/api/redeem",{method:"POST"});
  setBalance(d.balance);
  msg("تم إنشاء طلب الاستبدال: "+d.requestId);
  await load();

 }catch(e){
  msg(e.message);
 }
}

loginEl.addEventListener("click",login);
redeemEl.addEventListener("click",redeem);

if(uid)load();
</script>
</body>
</html>
