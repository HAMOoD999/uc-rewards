<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UC Rewards 🎮</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
  color:#111;
}

.card{
  max-width:520px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:18px;
  box-shadow:0 5px 20px #0001;
}

h1{
  text-align:center;
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  background:#111;
  color:#fff;
  border:0;
}

button:disabled{
  opacity:.5;
}

.balance{
  font-size:28px;
  font-weight:bold;
  text-align:center;
  padding:15px;
}

.task{
  border:1px solid #eee;
  padding:14px;
  border-radius:12px;
  margin:10px 0;
}

.small{
  color:#777;
  font-size:13px;
}

#msg{
  text-align:center;
  padding:8px;
}
</style>
</head>

<body>

<div class="card">

<h1>UC Rewards 🎮</h1>

<p class="small">
نظام مكافآت محفوظ على الخادم.
</p>

<div id="loginBox">

<input
  id="usernameInput"
  placeholder="اسم المستخدم"
>

<button id="loginBtn">
دخول / إنشاء حساب
</button>

</div>

<div id="account" style="display:none">

<div class="balance">
<span id="balance">0</span> نقطة
</div>

<h3>المهام</h3>

<div id="tasks"></div>

<h3>الاستبدال</h3>

<p class="small">
الحد الأدنى: 10,000 نقطة
</p>

<button id="redeemBtn">
استبدال 10,000 نقطة
</button>

<h3>السجل</h3>

<div id="history"></div>

</div>

<div id="msg"></div>

<p class="small">
هذه نسخة تجريبية. الاستبدال الفعلي بـ UC يحتاج ربطًا بجهة رسمية أو مزود معتمد.
</p>

</div>

<script>

let uid = localStorage.getItem('uc_user_id');

const $ = id => document.getElementById(id);

function msg(t){
  $('msg').textContent = t;
}

async function api(url, options = {}){

  options.headers = Object.assign(
    {
      'Content-Type':'application/json',
      'x-user-id':uid || ''
    },
    options.headers || {}
  );

  const r = await fetch(url, options);

  const d = await r.json().catch(() => ({}));

  if(!r.ok){
    throw new Error(d.error || 'حدث خطأ');
  }

  return d;
}

async function load(){

  if(!uid) return;

  try{

    const me = await api('/api/me');

    $('loginBox').style.display = 'none';
    $('account').style.display = 'block';

    $('balance').textContent = me.balance;

    const tasks = await api('/api/tasks');

    $('tasks').innerHTML = '';

    for(const t of tasks){

      const div = document.createElement('div');

      div.className = 'task';

      div.innerHTML =
        '<b>' + t.name + '</b>' +
        '<br>' +
        '<span class="small">+' +
        t.points +
        ' نقطة — تتجدد كل 24 ساعة</span>';

      const b = document.createElement('button');

      b.textContent = 'إكمال المهمة';

      b.onclick = () => completeTask(t.id, b);

      div.appendChild(b);

      $('tasks').appendChild(div);
    }

    const h = await api('/api/history');

    $('history').innerHTML = h.length
      ? h.map(x =>
          (x.points > 0 ? '+' : '') +
          x.points +
          ' نقطة — ' +
          new Date(x.created_at).toLocaleString('ar-OM')
        ).join('<br>')
      : 'لا يوجد سجل بعد';

  }catch(e){

    localStorage.removeItem('uc_user_id');

    uid = null;

    $('loginBox').style.display = 'block';
    $('account').style.display = 'none';

    msg(e.message);
  }
}

async function completeTask(id, button){

  button.disabled = true;

  try{

    const d = await api('/api/complete-task',{
      method:'POST',

      body:JSON.stringify({
        task_id:id
      })
    });

    msg(
      'تمت المهمة وإضافة ' +
      d.added +
      ' نقطة ✅'
    );

    await load();

  }catch(e){

    msg(e.message);

    button.disabled = false;
  }
}

$('loginBtn').onclick = async () => {

  try{

    const username =
      $('usernameInput').value.trim();

    if(!username){
      msg('اكتب اسم المستخدم');
      return;
    }

    const r = await fetch('/api/register',{
      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        username:username
      })
    });

    const d = await r.json();

    if(!r.ok){
      throw new Error(
        d.error || 'تعذر الدخول'
      );
    }

    uid = d.id;

    localStorage.setItem(
      'uc_user_id',
      uid
    );

    await load();

    msg('تم الدخول ✅');

  }catch(e){

    msg(e.message);
  }
};

$('redeemBtn').onclick = async () => {

  try{

    await api('/api/redeem',{
      method:'POST',

      body:JSON.stringify({
        amount:10000
      })
    });

    msg(
      'تم إرسال طلب الاستبدال للمراجعة ✅'
    );

    await load();

  }catch(e){

    msg(e.message);
  }
};

load();

</script>

</body>
</html>
